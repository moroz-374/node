services:
  remnanode:
    image: remnawave/node:latest
    container_name: remnanode
    hostname: remnanode
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - NODE_PORT=2222
      - SECRET_KEY=""
      - TRAFFIC_AUDIT_BACKEND_URL=""
      - TRAFFIC_AUDIT_CREDENTIAL=""
      - TRAFFIC_AUDIT_FLUSH_INTERVAL_MS=5000
      - TRAFFIC_AUDIT_QUEUE_MAX_SIZE=20000
      - TRAFFIC_AUDIT_REQUEST_TIMEOUT_MS=10000
      - TRAFFIC_AUDIT_BACKOFF_INITIAL_MS=1000
      - TRAFFIC_AUDIT_BACKOFF_MAX_MS=60000
