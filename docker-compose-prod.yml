services:
  remnanode:
    image: ghcr.io/moroz-374/remnawave-node:stable
    container_name: remnanode
    hostname: remnanode
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const net=require('net');const socket=net.connect({host:'127.0.0.1',port:Number(process.env.NODE_PORT)},()=>{socket.destroy();process.exit(0)});socket.setTimeout(2000);socket.on('timeout',()=>socket.destroy(new Error('timeout')));socket.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_PORT: ${NODE_PORT:?NODE_PORT is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      TRAFFIC_AUDIT_BACKEND_URL: ${TRAFFIC_AUDIT_BACKEND_URL:?TRAFFIC_AUDIT_BACKEND_URL is required}
      TRAFFIC_AUDIT_CREDENTIAL: ${TRAFFIC_AUDIT_CREDENTIAL:?TRAFFIC_AUDIT_CREDENTIAL is required}
      TRAFFIC_AUDIT_FLUSH_INTERVAL_MS: ${TRAFFIC_AUDIT_FLUSH_INTERVAL_MS:-5000}
      TRAFFIC_AUDIT_QUEUE_MAX_SIZE: ${TRAFFIC_AUDIT_QUEUE_MAX_SIZE:-20000}
      TRAFFIC_AUDIT_REQUEST_TIMEOUT_MS: ${TRAFFIC_AUDIT_REQUEST_TIMEOUT_MS:-10000}
      TRAFFIC_AUDIT_BACKOFF_INITIAL_MS: ${TRAFFIC_AUDIT_BACKOFF_INITIAL_MS:-1000}
      TRAFFIC_AUDIT_BACKOFF_MAX_MS: ${TRAFFIC_AUDIT_BACKOFF_MAX_MS:-60000}
